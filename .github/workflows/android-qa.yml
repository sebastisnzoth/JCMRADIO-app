name: Android QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint && npm run build && npx cap sync android
      - run: python3 scripts/prepare_android_images.py
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jcm-radio-qa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
