name: Build AAB para Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sincronizar Capacitor → Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build Release AAB sin firmar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: jcmradio-api36-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Resumen
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh $AAB | cut -f1)
          echo "## AAB API 36 generado" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** app-release.aab" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamaño:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** com.app.jcmradiorock" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK:** 36" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
