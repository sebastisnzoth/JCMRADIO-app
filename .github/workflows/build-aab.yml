name: Build AAB para Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sincronizar Capacitor → Android
        run: npx cap sync android

      - name: Regenerar recursos PNG Android válidos
        run: |
          python3 - <<'PY'
          import os, struct, zlib, math

          base = 'android/app/src/main/res'

          def chunk(kind, data):
              return (
                  struct.pack('>I', len(data)) + kind + data +
                  struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              )

          def make_png(w, h, mode='splash'):
              rows = []
              cx = (w - 1) / 2
              cy = (h - 1) / 2
              r1 = min(w, h) * 0.34
              r2 = min(w, h) * 0.23
              for y in range(h):
                  row = bytearray([0])
                  for x in range(w):
                      d = math.hypot(x - cx, y - cy)
                      if mode == 'foreground':
                          if d <= r2:
                              rgba = (220, 38, 38, 255)
                          elif d <= r1:
                              rgba = (245, 245, 245, 255)
                          else:
                              rgba = (0, 0, 0, 0)
                      elif mode == 'launcher':
                          if d <= r1:
                              rgba = (18, 18, 20, 255)
                          else:
                              rgba = (5, 5, 6, 255)
                      else:
                          # Splash simple y profesional: fondo oscuro + centro rojo.
                          if d <= r2:
                              rgba = (185, 28, 28, 255)
                          elif d <= r1:
                              rgba = (25, 25, 28, 255)
                          else:
                              rgba = (5, 5, 6, 255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw = b''.join(rows)
              return (
                  b'\x89PNG\r\n\x1a\n' +
                  chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) +
                  chunk(b'IDAT', zlib.compress(raw, 9)) +
                  chunk(b'IEND', b'')
              )

          # Launcher icons: regenerate every density with valid PNG bytes.
          launcher_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in launcher_sizes.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              assets = {
                  'ic_launcher.png': make_png(size, size, 'launcher'),
                  'ic_launcher_round.png': make_png(size, size, 'launcher'),
                  'ic_launcher_foreground.png': make_png(size, size, 'foreground'),
              }
              for name, data in assets.items():
                  target = os.path.join(path, name)
                  with open(target, 'wb') as f:
                      f.write(data)
                  print('Regenerado:', target)

          # Splash: overwrite ALL splash.png under res, including portrait/landscape
          # and every density, so no corrupt legacy PNG can break AAPT2.
          splash_data = make_png(256, 256, 'splash')
          splash_count = 0
          for root, dirs, files in os.walk(base):
              if 'splash.png' in files:
                  target = os.path.join(root, 'splash.png')
                  with open(target, 'wb') as f:
                      f.write(splash_data)
                  splash_count += 1
                  print('Regenerado:', target)

          # Ensure the generic drawable splash always exists and is valid.
          generic = os.path.join(base, 'drawable', 'splash.png')
          os.makedirs(os.path.dirname(generic), exist_ok=True)
          with open(generic, 'wb') as f:
              f.write(splash_data)
          print('Splash regenerados:', splash_count)

          # Validate PNG signatures for every Android PNG resource.
          bad = []
          checked = 0
          for root, dirs, files in os.walk(base):
              for name in files:
                  if not name.lower().endswith('.png'):
                      continue
                  path = os.path.join(root, name)
                  checked += 1
                  with open(path, 'rb') as f:
                      sig = f.read(8)
                  if sig != b'\x89PNG\r\n\x1a\n':
                      bad.append(path)
          print('PNG validados:', checked)
          if bad:
              raise SystemExit('PNG inválidos restantes: ' + ', '.join(bad))
          PY

          file android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          file android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          file android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          file android/app/src/main/res/drawable/splash.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Instalar Gradle 8.14.3 manualmente
        run: |
          curl -L --retry 3 -o /tmp/gradle-8.14.3-bin.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle-8.14.3-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Verificar Gradle
        run: gradle --version

      - name: Limpiar build Android
        working-directory: android
        run: gradle clean --no-daemon

      - name: Build Release AAB sin firmar
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Verificar AAB generado
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: jcmradio-api36-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Resumen
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh $AAB | cut -f1)
          echo "## AAB API 36 generado" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** app-release.aab" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamaño:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** com.app.jcmradiorock" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK:** 36" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
