name: Build AAB para Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sincronizar Capacitor → Android
        run: npx cap sync android

      - name: Regenerar iconos Android válidos
        run: |
          python3 - <<'PY'
          import os, struct, zlib, math

          base = 'android/app/src/main/res'
          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          def png_bytes(w, h, foreground=False):
              rows = []
              cx = cy = (w - 1) / 2
              radius = w * 0.39
              inner = w * 0.27
              for y in range(h):
                  row = bytearray([0])
                  for x in range(w):
                      d = math.hypot(x-cx, y-cy)
                      if foreground:
                          if d <= inner:
                              rgba = (220, 38, 38, 255)
                          elif d <= radius:
                              rgba = (245, 245, 245, 255)
                          else:
                              rgba = (0, 0, 0, 0)
                      else:
                          if d <= radius:
                              rgba = (18, 18, 20, 255)
                          else:
                              rgba = (5, 5, 6, 255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw = b''.join(rows)
              def chunk(kind, data):
                  return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              return (b'\x89PNG\r\n\x1a\n' +
                      chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) +
                      chunk(b'IDAT', zlib.compress(raw, 9)) +
                      chunk(b'IEND', b''))

          for folder, size in densities.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              files = {
                  'ic_launcher.png': png_bytes(size, size, False),
                  'ic_launcher_round.png': png_bytes(size, size, False),
                  'ic_launcher_foreground.png': png_bytes(size, size, True),
              }
              for name, data in files.items():
                  with open(os.path.join(path, name), 'wb') as f:
                      f.write(data)
                  print('Regenerado:', os.path.join(path, name), len(data), 'bytes')
          PY
          file android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          file android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          file android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Instalar Gradle 8.14.3 manualmente
        run: |
          curl -L --retry 3 -o /tmp/gradle-8.14.3-bin.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle-8.14.3-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Verificar Gradle
        run: gradle --version

      - name: Build Release AAB sin firmar
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: jcmradio-api36-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Resumen
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh $AAB | cut -f1)
          echo "## AAB API 36 generado" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** app-release.aab" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamaño:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** com.app.jcmradiorock" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK:** 36" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
